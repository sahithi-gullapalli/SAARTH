services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: saarth
      POSTGRES_PASSWORD: saarth
      POSTGRES_DB: saarth
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saarth"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: [.env.example]
    environment:
      SAARTH_VECTOR_BACKEND: pgvector
      DATABASE_URL: postgresql://saarth:saarth@db:5432/saarth
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      SAARTH_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
    healthcheck:
      disable: true

volumes:
  pgdata:
