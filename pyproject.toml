[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saarth"
version = "1.0.0"
description = "SAARTH - RAG-powered multi-agent AI assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "langgraph>=0.2",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "requests>=2.31",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "boto3>=1.34"]
rag = ["langchain>=0.2", "langchain-text-splitters>=0.2", "llama-index-core>=0.10"]
vectors = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "chromadb>=0.5", "psycopg[binary]>=3.1", "pgvector>=0.3"]
ui = ["streamlit>=1.36"]
crewai = ["crewai>=0.60"]
eval = ["ragas>=0.1.10", "datasets>=2.20", "deepeval>=1.0", "langsmith>=0.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
all = ["saarth[llm,rag,vectors,ui,eval,dev]"]

[project.scripts]
saarth = "saarth.cli:main"

[tool.setuptools.packages.find]
include = ["saarth*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 132
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM905"]  # FastAPI File() defaults are idiomatic

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
